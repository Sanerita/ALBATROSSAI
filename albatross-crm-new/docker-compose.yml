version: '3.8'

services:
  web:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - lead-qualifier
  
  lead-qualifier:
    build: ./agents/lead_qualifier
    ports:
      - "5000:5000"
    env_file: .env
    volumes:
      - ./agents/lead_qualifier:/app

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"